# Continuous dependency monitoring for RIFQ Muslim.
#
# The repository-wide security scan only reads *resolved* dependency files, and it
# cannot attribute a buildscript-only lockfile to android/build.gradle.kts (that root
# project applies no plugins, so Gradle emits no project-level lockfile for it).
# Both Gradle lockfiles are nevertheless committed and resolved:
#   android/app/gradle.lockfile          -> the APK's library graph
#   android/buildscript-gradle.lockfile  -> the AGP / Kotlin plugin classpath
# Dependabot reads those lockfiles directly, which is what closes that attribution
# gap. Remaining external step: enable "Dependabot alerts" in the repository's
# Settings -> Code security. See docs/SECURITY_COVERAGE.md sections 2.2 and 3.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(gradle)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
